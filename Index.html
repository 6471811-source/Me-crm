  var root = document.getElementById('ceilingcore-root');

  // ============ 3D и логика ============
  function initAll() {
    if (typeof THREE === 'undefined') {
      console.warn('[CEILINGCORE] Three.js не загрузился');
      return;
    }

    // HERO 3D
    (function() {
      var canvas = document.getElementById('hero-3d');
      if (!canvas) return;
      var parent = canvas.parentElement;
      var size = Math.min(parent.clientWidth, parent.clientHeight) || 500;

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
      camera.position.set(0, 0, 12);

      var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(size, size, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      var nodes = [];
      var nodeGeo = new THREE.SphereGeometry(0.08, 12, 12);
      for (var i = 0; i < 60; i++) {
        var theta = Math.random() * Math.PI * 2;
        var phi = Math.acos(2 * Math.random() - 1);
        var r = 3.5 + Math.random() * 1.5;
        var x = r * Math.sin(phi) * Math.cos(theta);
        var y = r * Math.sin(phi) * Math.sin(theta);
        var z = r * Math.cos(phi);
        var rand = Math.random();
        var color = 0x0a0a0a;
        if (rand < 0.15) color = 0xff3b1f;
        else if (rand < 0.22) color = 0x00ff88;
        var mat = new THREE.MeshBasicMaterial({ color: color });
        var node = new THREE.Mesh(nodeGeo, mat);
        node.position.set(x, y, z);
        scene.add(node);
        nodes.push({ pos: new THREE.Vector3(x, y, z), accent: rand < 0.22 });
      }

      var lineMat = new THREE.LineBasicMaterial({ color: 0x0a0a0a, transparent: true, opacity: 0.15 });
      var accentLineMat = new THREE.LineBasicMaterial({ color: 0xff3b1f, transparent: true, opacity: 0.5 });
      for (var a = 0; a < nodes.length; a++) {
        for (var b = a + 1; b < nodes.length; b++) {
          if (nodes[a].pos.distanceTo(nodes[b].pos) < 1.7) {
            var geo = new THREE.BufferGeometry().setFromPoints([nodes[a].pos, nodes[b].pos]);
            var m = (nodes[a].accent || nodes[b].accent) ? accentLineMat : lineMat;
            scene.add(new THREE.Line(geo, m));
          }
        }
      }

      var core = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.1, 1),
        new THREE.MeshBasicMaterial({ color: 0x0a0a0a, wireframe: true, transparent: true, opacity: 0.5 })
      );
      scene.add(core);

      var innerCore = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.55, 0),
        new THREE.MeshBasicMaterial({ color: 0xff3b1f })
      );
      scene.add(innerCore);

      var ringGeo = new THREE.TorusGeometry(2.2, 0.008, 8, 80);
      var ringMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a, transparent: true, opacity: 0.4 });
      var r1 = new THREE.Mesh(ringGeo, ringMat); r1.rotation.x = Math.PI / 2.3; scene.add(r1);
      var r2 = new THREE.Mesh(ringGeo, ringMat); r2.rotation.y = Math.PI / 2.5; scene.add(r2);
      var r3 = new THREE.Mesh(ringGeo, ringMat); r3.rotation.z = Math.PI / 3; scene.add(r3);

      var dots = [];
      for (var d = 0; d < 30; d++) {
        var dot = new THREE.Mesh(
          new THREE.SphereGeometry(0.04, 8, 8),
          new THREE.MeshBasicMaterial({ color: d % 2 === 0 ? 0xff3b1f : 0x00ff88 })
        );
        dot.userData.angle = Math.random() * Math.PI * 2;
        dot.userData.radius = 2 + Math.random() * 2;
        dot.userData.speed = 0.3 + Math.random() * 0.6;
        dot.userData.axis = Math.random() < 0.5 ? 'x' : 'y';
        dot.userData.y = (Math.random() - 0.5) * 2;
        scene.add(dot);
        dots.push(dot);
      }

      var mx = 0, my = 0;
      window.addEventListener('mousemove', function(e) {
        mx = (e.clientX / window.innerWidth - 0.5) * 2;
        my = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      var startTime = performance.now();
      function animate() {
        requestAnimationFrame(animate);
        var t = (performance.now() - startTime) / 1000;
        core.rotation.x = t * 0.15; core.rotation.y = t * 0.2;
        innerCore.rotation.x = -t * 0.3; innerCore.rotation.y = -t * 0.4;
        r1.rotation.z = t * 0.1; r2.rotation.x = t * 0.12; r3.rotation.y = t * 0.08;
        dots.forEach(function(dot) {
          dot.userData.angle += 0.01 * dot.userData.speed;
          var ang = dot.userData.angle;
          var rad = dot.userData.radius;
          if (dot.userData.axis === 'x') dot.position.set(Math.cos(ang) * rad, dot.userData.y, Math.sin(ang) * rad);
          else dot.position.set(dot.userData.y, Math.cos(ang) * rad, Math.sin(ang) * rad);
        });
        innerCore.scale.setScalar(1 + Math.sin(t * 2.5) * 0.08);
        scene.rotation.y += (mx * 0.4 - scene.rotation.y) * 0.05;
        scene.rotation.x += (-my * 0.3 - scene.rotation.x) * 0.05;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', function() {
        var s = Math.min(parent.clientWidth, parent.clientHeight);
        if (s > 0) renderer.setSize(s, s, false);
      });
    })();

    // 3D MODELS
    function setupModel(containerId, buildFn, options) {
      options = options || {};
      var container = document.getElementById(containerId);
      if (!container) return;

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(45, 1.6, 0.1, 100);
      camera.position.set(0, options.cameraY || 2.5, options.cameraZ || 7);

      var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1.0));
      scene.add(new THREE.HemisphereLight(0xffffff, 0xeeeee8, 0.8));

      var key = new THREE.DirectionalLight(0xffffff, 2.5);
      key.position.set(6, 10, 8);
      scene.add(key);

      var fill = new THREE.DirectionalLight(0xffffff, 1.0);
      fill.position.set(-5, 3, 4);
      scene.add(fill);

      var rim = new THREE.DirectionalLight(0xff3b1f, 1.2);
      rim.position.set(0, -4, -6);
      scene.add(rim);

      var group = new THREE.Group();
      scene.add(group);

      var animation = buildFn(group) || function(){};

      function resize() {
        var w = container.clientWidth;
        var h = container.clientHeight;
        if (w === 0 || h === 0) return;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', resize);
      setTimeout(resize, 50);
      setTimeout(resize, 300);
      resize();

      var startTime = performance.now();
      var lastTime = startTime;

      function animate() {
        requestAnimationFrame(animate);
        var now = performance.now();
        var dt = (now - lastTime) / 1000;
        var t = (now - startTime) / 1000;
        lastTime = now;

        animation(t, dt);
        if (options.autoRotate !== false) {

    // BUILDING
    setupModel('model-building', function(group) {
      var matConcrete = new THREE.MeshStandardMaterial({ color: 0xd8dde5, metalness: 0.1, roughness: 0.85 });
      var matGlass = new THREE.MeshStandardMaterial({ color: 0xa8d4e8, metalness: 0.3, roughness: 0.1, transparent: true, opacity: 0.5 });
      var matAccent = new THREE.MeshStandardMaterial({ color: 0xff3b1f, metalness: 0.6, roughness: 0.3, emissive: 0xff3b1f, emissiveIntensity: 0.4 });

      var W = 3, D = 3, FLOORS = 5, FLOOR_H = 0.8;
      var base = new THREE.Mesh(new THREE.BoxGeometry(W + 0.6, 0.15, D + 0.6), matConcrete);
      base.position.y = -0.075;
      group.add(base);

      var elements = [];
      var colGeo = new THREE.BoxGeometry(0.15, FLOOR_H, 0.15);
      for (var x = 0; x < 2; x++) {
        for (var z = 0; z < 2; z++) {
          for (var f = 0; f < FLOORS; f++) {
            var cx = x === 0 ? -W/2 + 0.08 : W/2 - 0.08;
            var cz = z === 0 ? -D/2 + 0.08 : D/2 - 0.08;
            var col = new THREE.Mesh(colGeo, matConcrete);
            col.position.set(cx, f * FLOOR_H + FLOOR_H/2, cz);
            col.scale.set(0.001, 0.001, 0.001);
            col.userData.delay = f * 0.4 + (x + z) * 0.1;
            group.add(col);
            elements.push(col);
          }
        }
      }

      for (var fl = 0; fl <= FLOORS; fl++) {
        var slab = new THREE.Mesh(new THREE.BoxGeometry(W, 0.1, D), matConcrete);
        slab.position.y = fl * FLOOR_H + 0.05;
        slab.scale.set(0.001, 1, 0.001);
        slab.userData.delay = fl * 0.4;
        slab.userData.isSlab = true;
        group.add(slab);
        elements.push(slab);
      }

      for (var f2 = 0; f2 < FLOORS; f2++) {
        var fFront = new THREE.Mesh(new THREE.BoxGeometry(W - 0.3, FLOOR_H - 0.15, 0.03), matGlass);
        fFront.position.set(0, f2 * FLOOR_H + FLOOR_H/2, D/2 - 0.02);
        fFront.scale.set(0.001, 1, 1);
        fFront.userData.delay = f2 * 0.4 + 0.5;
        fFront.userData.isFacadeX = true;
        group.add(fFront);
        elements.push(fFront);

        var fBack = new THREE.Mesh(new THREE.BoxGeometry(W - 0.3, FLOOR_H - 0.15, 0.03), matGlass);
        fBack.position.set(0, f2 * FLOOR_H + FLOOR_H/2, -D/2 + 0.02);
        fBack.scale.set(0.001, 1, 1);
        fBack.userData.delay = f2 * 0.4 + 0.5;
        fBack.userData.isFacadeX = true;
        group.add(fBack);
        elements.push(fBack);

        var fLeft = new THREE.Mesh(new THREE.BoxGeometry(0.03, FLOOR_H - 0.15, D - 0.3), matGlass);
        fLeft.position.set(-W/2 + 0.02, f2 * FLOOR_H + FLOOR_H/2, 0);
        fLeft.scale.set(1, 1, 0.001);
        fLeft.userData.delay = f2 * 0.4 + 0.6;
        fLeft.userData.isFacadeZ = true;
        group.add(fLeft);
        elements.push(fLeft);

        var fRight = new THREE.Mesh(new THREE.BoxGeometry(0.03, FLOOR_H - 0.15, D - 0.3), matGlass);
        fRight.position.set(W/2 - 0.02, f2 * FLOOR_H + FLOOR_H/2, 0);
        fRight.scale.set(1, 1, 0.001);
        fRight.userData.delay = f2 * 0.4 + 0.6;
        fRight.userData.isFacadeZ = true;
        group.add(fRight);
        elements.push(fRight);
      }

      var roof = new THREE.Mesh(new THREE.BoxGeometry(W * 0.6, 0.3, D * 0.6), matAccent);
      roof.position.y = FLOORS * FLOOR_H + 0.35;
      roof.scale.set(0.001, 0.001, 0.001);
      roof.userData.delay = FLOORS * 0.4 + 0.3;
      group.add(roof);
      elements.push(roof);

      group.position.y = -FLOORS * FLOOR_H / 2 + 0.2;
      group.rotation.y = 0.5;

      return function(t) {
        var CYCLE = 6.0;
        var cycleT = (t % CYCLE);
        elements.forEach(function(el) {
          var appearTime = 0.8;
          var progress = Math.max(0, Math.min(1, (cycleT - el.userData.delay) / appearTime));
          var eased = 1 - Math.pow(1 - progress, 3);
          if (el.userData.isSlab) { el.scale.x = 0.001 + eased * 0.999; el.scale.z = 0.001 + eased * 0.999; }
          else if (el.userData.isFacadeX) el.scale.x = 0.001 + eased * 0.999;
          else if (el.userData.isFacadeZ) el.scale.z = 0.001 + eased * 0.999;
          else { var s = 0.001 + eased * 0.999; el.scale.set(s, s, s); }
        });
        group.rotation.y = 0.5 + cycleT * 0.35;
      };
    }, { cameraY: 3.5, cameraZ: 8, autoRotate: false });

    // ASSEMBLY
    setupModel('model-assembly', function(group) {
      var matSteel = new THREE.MeshStandardMaterial({ color: 0xe8ecf1, metalness: 0.9, roughness: 0.2 });
      var matSteelDark = new THREE.MeshStandardMaterial({ color: 0x6a7382, metalness: 0.9, roughness: 0.3 });
      var matBronze = new THREE.MeshStandardMaterial({ color: 0xd4a76a, metalness: 0.85, roughness: 0.28 });
      var matAccent = new THREE.MeshStandardMaterial({ color: 0xff3b1f, metalness: 0.7, roughness: 0.3, emissive: 0xff3b1f, emissiveIntensity: 0.3 });
      var matBolt = new THREE.MeshStandardMaterial({ color: 0x4a5260, metalness: 0.9, roughness: 0.25 });
      var ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.05 });

      var parts = [];
      var mech = new THREE.Group();
      group.add(mech);

      var shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3.5, 32), matSteelDark);
      shaft.rotation.z = Math.PI / 2;
      mech.add(shaft);
      parts.push({ mesh: shaft, start: new THREE.Vector3(0, 6, 0), end: new THREE.Vector3(0, 0, 0), startRot: new THREE.Euler(0, Math.PI * 2, Math.PI / 2), endRot: new THREE.Euler(0, 0, Math.PI / 2), delay: 0.0 });

      function makeBearing(xPos, delay) {
        var g = new THREE.Group();
        var outer = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.12, 16, 64), matSteel);
        outer.rotation.y = Math.PI / 2;
        g.add(outer);
        var inner = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.09, 16, 48), matSteelDark);
        inner.rotation.y = Math.PI / 2;
        g.add(inner);
        for (var i = 0; i < 8; i++) {
          var a = (i / 8) * Math.PI * 2;
          var ball = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 20), ballMat);
          ball.position.set(0, Math.cos(a) * 0.425, Math.sin(a) * 0.425);
          g.add(ball);
        }
        g.position.set(xPos, 0, 0);
        mech.add(g);
        parts.push({ mesh: g, start: new THREE.Vector3(xPos * 4, 4, 0), end: new THREE.Vector3(xPos, 0, 0), startRot: new THREE.Euler(Math.PI * 2, 0, 0), endRot: new THREE.Euler(0, 0, 0), delay: delay });
      }
      makeBearing(-1.2, 0.4);
      makeBearing(1.2, 0.6);

      function makeGear(radius, teeth, thickness, mat) {
        var g = new THREE.Group();
        var body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thickness, 48), mat);
        body.rotation.x = Math.PI / 2;
        g.add(body);
        var toothH = radius * 0.16;
        var module = (2 * radius) / teeth;
        for (var i = 0; i < teeth; i++) {
          var a = (i / teeth) * Math.PI * 2;
          var tooth = new THREE.Mesh(new THREE.BoxGeometry(module * 0.85, toothH, thickness * 0.95), mat);
          tooth.position.set(Math.cos(a) * (radius + toothH * 0.5), Math.sin(a) * (radius + toothH * 0.5), 0);
          tooth.rotation.z = a;
          g.add(tooth);
        }
        return g;
      }

      var mainGear = makeGear(0.85, 20, 0.5, matSteel);
      mech.add(mainGear);
      parts.push({ mesh: mainGear, start: new THREE.Vector3(0, -5, 0), end: new THREE.Vector3(0, 0, 0), startRot: new THREE.Euler(0, 0, -Math.PI * 3), endRot: new THREE.Euler(0, 0, 0), delay: 1.0 });

      var small1 = makeGear(0.5, 12, 0.45, matBronze);
      small1.position.set(0, 1.3, 0);
      mech.add(small1);
      parts.push({ mesh: small1, start: new THREE.Vector3(-5, 6, 0), end: new THREE.Vector3(0, 1.3, 0), startRot: new THREE.Euler(0, 0, Math.PI * 4), endRot: new THREE.Euler(0, 0, 0), delay: 1.4 });

      var small2 = makeGear(0.5, 12, 0.45, matBronze);
      small2.position.set(0, -1.3, 0);
      mech.add(small2);
      parts.push({ mesh: small2, start: new THREE.Vector3(5, 6, 0), end: new THREE.Vector3(0, -1.3, 0), startRot: new THREE.Euler(0, 0, -Math.PI * 4), endRot: new THREE.Euler(0, 0, 0), delay: 1.4 });

      var capRight = new THREE.Group();
      var capDisc = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.15, 48), matSteel);
      capDisc.rotation.z = Math.PI / 2;
      capRight.add(capDisc);
      for (var ci = 0; ci < 6; ci++) {
        var ca = (ci / 6) * Math.PI * 2;
        var boltH = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.1, 6), matBolt);
        boltH.rotation.z = Math.PI / 2;
        boltH.position.set(0.1, Math.cos(ca) * 0.7, Math.sin(ca) * 0.7);
        capRight.add(boltH);
      }
      capRight.position.set(1.9, 0, 0);
      mech.add(capRight);
      parts.push({ mesh: capRight, start: new THREE.Vector3(6, 0, 0), end: new THREE.Vector3(1.9, 0, 0), startRot: new THREE.Euler(0, Math.PI * 2, 0), endRot: new THREE.Euler(0, 0, 0), delay: 1.8 });

      var capLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.12, 32), matAccent);
      capLeft.rotation.z = Math.PI / 2;
      capLeft.position.set(-1.9, 0, 0);
      mech.add(capLeft);
      parts.push({ mesh: capLeft, start: new THREE.Vector3(-6, 0, 0), end: new THREE.Vector3(-1.9, 0, 0), startRot: new THREE.Euler(0, -Math.PI * 2, 0), endRot: new THREE.Euler(0, 0, 0), delay: 2.0 });

      group.rotation.x = -0.3;
      group.rotation.y = 0.4;

      return function(t) {
        var CYCLE = 8.0;
        var cycleT = (t % CYCLE);
        var progress;
        if (cycleT < 0.6) progress = 1;
        else if (cycleT < 4.5) {
          var phase = (cycleT - 0.6) / 3.9;
          progress = phase < 0.5 ? 1 - phase * 2 : (phase - 0.5) * 2;
        } else progress = 1;

        parts.forEach(function(p) {
          var pp = Math.max(0, Math.min(1, (progress - (p.delay / CYCLE) * 0.3) / (1 - (p.delay / CYCLE) * 0.3)));
          var eased = 1 - Math.pow(1 - pp, 3);
          p.mesh.position.lerpVectors(p.start, p.end, eased);
          p.mesh.rotation.x = p.startRot.x + (p.endRot.x - p.startRot.x) * eased;
          p.mesh.rotation.y = p.startRot.y + (p.endRot.y - p.startRot.y) * eased;
          p.mesh.rotation.z = p.startRot.z + (p.endRot.z - p.startRot.z) * eased;
        });

        if (progress > 0.9) {
          var spin = t * 1.5;
          mainGear.rotation.z = spin;
          small1.rotation.z = -spin * (20/12);
          small2.rotation.z = -spin * (20/12);
        }
        mech.rotation.y = Math.sin(t * 0.2) * 0.4;
      };
    }, { cameraY: 1.5, cameraZ: 8, autoRotate: false });

      push();
    })();

    // COUNTERS
    (function() {
      var counters = document.querySelectorAll('.dash-value[data-count]');
      counters.forEach(function(c) {
        var target = parseInt(c.dataset.count, 10);
        var start = performance.now();
        function tick(now) {
          var p = Math.min((now - start) / 1600, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          c.textContent = Math.floor(target * eased);
          if (p < 1) requestAnimationFrame(tick);
          else c.textContent = target;
        }
        requestAnimationFrame(tick);
      });
    })();

    // REVEAL
    (function() {
      var els = document.querySelectorAll('.reveal');
      if (!('IntersectionObserver' in window)) {
        els.forEach(function(el) { el.classList.add('visible'); });
        return;
      }
      var obs = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });
      els.forEach(function(el) { obs.observe(el); });
    })();

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }
})();
</script>
